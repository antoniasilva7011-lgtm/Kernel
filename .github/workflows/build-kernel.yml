name: Build A52Q Ascendia 14 KernelSU

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-kernel.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libssl-dev libelf-dev \
            libncurses-dev python3 rsync unzip zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone official Ascendia AOSP KernelSU source
        run: |
          git clone --depth=1 \
            --branch ascendia-14-ksu-aosp \
            https://github.com/RisenID/kernel_samsung_ascendia_sm7125.git kernel
          cd kernel
          echo "Kernel source commit:"
          git rev-parse HEAD
          test -f arch/arm64/configs/vendor/a52q_eur_open_defconfig

          # Preserve the exact KernelSU commit pinned by Ascendia, but clone its
          # repository with full history so KSU_VERSION is calculated correctly.
          KSU_SHA=$(git ls-tree HEAD KernelSU | awk '{print $3}')
          echo "Pinned KernelSU commit: $KSU_SHA"
          test -n "$KSU_SHA"
          rm -rf KernelSU
          git clone https://github.com/ananjaser1211/KernelSU.git KernelSU
          git -C KernelSU checkout "$KSU_SHA"

          KSU_COUNT=$(git -C KernelSU rev-list --count HEAD)
          KSU_VERSION=$((10000 + KSU_COUNT + 200))
          echo "KernelSU commit count: $KSU_COUNT"
          echo "Expected KSU_VERSION: $KSU_VERSION"
          test "$KSU_VERSION" -ge 11071

      - name: Download maintainer-matching AOSP clang r416183c2
        run: |
          mkdir toolchain
          cd toolchain
          git init
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git fetch --depth=1 origin 4625961de9653580dcc53a3117ce5e844d1be6c2
          git checkout FETCH_HEAD -- clang-r416183c2
          test -x clang-r416183c2/bin/clang
          ./clang-r416183c2/bin/clang --version | head -n 2

      - name: Configure A52Q exactly like maintainer
        working-directory: kernel
        env:
          TC: ${{ github.workspace }}/toolchain/clang-r416183c2
        run: |
          export PATH="$TC/bin:$PATH"
          export LD_LIBRARY_PATH="$TC/lib64:${LD_LIBRARY_PATH:-}"
          rm -rf out
          make ARCH=arm64 O=out vendor/a52q_eur_open_defconfig
          test -s out/.config
          echo "==== Identity / KSU config ===="
          grep -E 'CONFIG_(LOCALVERSION|KSU|KPROBES|HAVE_KPROBES|OVERLAY_FS)=' out/.config || true

          KSU_COUNT=$(git -C KernelSU rev-list --count HEAD)
          KSU_VERSION=$((10000 + KSU_COUNT + 200))
          echo "KSU_VERSION=$KSU_VERSION"
          test "$KSU_VERSION" -ge 11071

      - name: Build A52Q kernel exactly like maintainer script
        working-directory: kernel
        env:
          TC: ${{ github.workspace }}/toolchain/clang-r416183c2
        run: |
          export PATH="$TC/bin:$PATH"
          export LD_LIBRARY_PATH="$TC/lib64:${LD_LIBRARY_PATH:-}"
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            AR="llvm-ar" NM="llvm-nm" LD="ld.lld" AS="llvm-as" \
            STRIP="llvm-strip" OBJCOPY="llvm-objcopy" OBJDUMP="llvm-objdump" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dts/qcom/atoll-ab-idp.dtb

          ls -lh out/arch/arm64/boot/Image \
                 out/arch/arm64/boot/Image.gz \
                 out/arch/arm64/boot/dts/qcom/atoll-ab-idp.dtb

      - name: Validate output before packaging
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, gzip
          image = Path("out/arch/arm64/boot/Image")
          image_gz = Path("out/arch/arm64/boot/Image.gz")
          dtb = Path("out/arch/arm64/boot/dts/qcom/atoll-ab-idp.dtb")
          assert image.stat().st_size > 40_000_000
          assert image_gz.stat().st_size > 10_000_000
          assert dtb.read_bytes()[:4] == bytes.fromhex("d00dfeed")
          dec = gzip.decompress(image_gz.read_bytes())
          assert dec == image.read_bytes()
          for p in (image, image_gz, dtb):
              print(p, p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Collect NON-FLASHABLE build outputs
        run: |
          mkdir -p artifacts
          cp kernel/out/arch/arm64/boot/Image artifacts/
          cp kernel/out/arch/arm64/boot/Image.gz artifacts/
          cp kernel/out/arch/arm64/boot/dts/qcom/atoll-ab-idp.dtb artifacts/
          cp kernel/out/.config artifacts/kernel-config.txt
          {
            echo "Device: Samsung Galaxy A52 4G (a52q)"
            echo "ROM/kernel family: RisingOS 14 / Ascendia AOSP"
            echo "Source: RisenID/kernel_samsung_ascendia_sm7125"
            echo "Branch: ascendia-14-ksu-aosp"
            echo "Defconfig: vendor/a52q_eur_open_defconfig"
            echo "Toolchain: AOSP clang-r416183c2"
            echo "IMPORTANT: these files are NOT flashable directly."
            echo "They must be repacked into the user's known-good boot image after structural comparison."
          } > artifacts/BUILD-INFO.txt

      - name: Upload validated raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A52Q-Ascendia14-KSU-RAW
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
